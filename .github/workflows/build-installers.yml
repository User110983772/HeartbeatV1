# Builds the Heartbeat installers for Windows, macOS and Linux on GitHub's runners.
# Run it from the Actions tab (workflow_dispatch) or by pushing a tag like v1.0.0.
#
# The factory content (448 MB of wavetables) isn't in the repository. Upload heartbeat-content.zip (made by
# installer/make_content_zip.sh; it holds heartbeat-factory/, Presets/ and Melodies/) somewhere downloadable, e.g. as an
# asset of a GitHub release, and set its URL as the repository variable FACTORY_CONTENT_URL
# (Settings > Secrets and variables > Actions > Variables).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  VERSION: '1.0.0'

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch factory content
        run: |
          curl -fsSL -o "$RUNNER_TEMP/content.zip" "${{ vars.FACTORY_CONTENT_URL }}"
          unzip -q "$RUNNER_TEMP/content.zip" -d "$GITHUB_WORKSPACE/.."
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libfreetype6-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libsecret-1-dev libglib2.0-dev libjack-jackd2-dev
      - name: Build and package
        run: bash installer/linux/build_packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: heartbeat-linux
          path: installer/out/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch factory content
        run: |
          curl -fsSL -o "$RUNNER_TEMP/content.zip" "${{ vars.FACTORY_CONTENT_URL }}"
          unzip -q "$RUNNER_TEMP/content.zip" -d "$GITHUB_WORKSPACE/.."
      - name: Build and package
        run: bash installer/macos/build_pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: heartbeat-macos
          path: installer/out/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch factory content
        shell: pwsh
        run: |
          Invoke-WebRequest "${{ vars.FACTORY_CONTENT_URL }}" -OutFile "$env:RUNNER_TEMP\content.zip"
          Expand-Archive "$env:RUNNER_TEMP\content.zip" -DestinationPath (Split-Path $env:GITHUB_WORKSPACE)
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and package
        shell: cmd
        run: installer\windows\build_installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: heartbeat-windows
          path: installer/out/*
